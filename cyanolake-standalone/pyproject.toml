[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cyanolake"
version = "2.6.8.1"
description = "Standalone Sentinel-3 OLCI L2Gen and native HydroLAKES cyanobacteria processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "netCDF4>=1.6,<2", "xarray>=2024.1",
  "h5netcdf>=1.3", "scipy>=1.11", "matplotlib>=3.8", "requests>=2.31",
  "tqdm>=4.66", "pyresample>=1.28", "pyproj>=3.6", "shapely>=2.0,<3",
  "geopandas>=1.0", "pyogrio>=0.9", "rasterio>=1.3", "cartopy>=0.23",
  "plotly>=6.0", "pillow>=10", "xyzservices", "gradio>=6.0,<7",
  "boto3>=1.34", "pyarrow>=15", "folium>=0.17", "pycountry>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.scripts]
cyanolake = "cyanolake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F821", "F822", "F823", "I"]
